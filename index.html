<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Project</title>
</head>
<body>
    <script type="module" src="./script.js"></script>

    <div class="scene-frame">
        <canvas class="webgl"></canvas>

        <div id="cube-controls-hint" class="cube-controls-hint">
            <div class="hint-title">Cube Controls</div>

            <div class="hint-row">
                <span class="hint-key">Colored face</span>
                <span>twist layer</span>
            </div>

            <div class="hint-row">
                <span class="hint-key">Empty space</span>
                <span>rotate cube</span>
            </div>

            <div class="hint-divider"></div>

            <div class="hint-row">
                <span class="hint-key">Left side ↑↓</span>
                <span>TILT UP/DOWN</span>
            </div>

            <div class="hint-row">
                <span class="hint-key">Right side ↑↓</span>
                <span>TILT SIDEWAYS</span>
            </div>

            <div class="hint-row">
                <span class="hint-key">Drag ← →</span>
                <span>SPIN AROUND</span>
            </div>
        </div>
    </div>

    <div class="loading-bar"></div>

    <div class="point" id="hotspot-cube">
        <div class="text">[ Cognitive Calibration Unit ]</div>
        <div class="label">1</div>
    </div>

    <div class="point" id="hotspot-terminal">
        <div class="text">[ Mainframe Access Console ]</div>
        <div class="label">2</div>
    </div>
</body>
</html>
