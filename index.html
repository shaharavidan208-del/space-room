<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Project</title>
</head>
<body>
    <script type="module" src="./script.js"></script>
    <div class="social-links">
    <a
        class="social-link"
        href="https://github.com/shaharavidan208-del"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub profile"
        title="GitHub"
    >
        <img
            class="social-icon"
            src="/icons/github-svgrepo-com.svg"
            alt=""
        />
    </a>
</div>
    <div class="scene-frame">
        <canvas class="webgl"></canvas>

        <div id="cube-controls-hint" class="cube-controls-hint">
            <div class="hint-title">Cube Controls</div>
            <div class="hint-row">
                <span class="hint-key">LMB</span>
                <span>ROTATE LAYER</span>
            </div>

            <div class="hint-row">
                <span class="hint-key">RMB</span>
                <span>ROTATE CUBE</span>
            </div>
        </div>
    </div>

    <div class="loading-screen">
    <div class="loading-panel">
        <p class="loading-label">SYSTEM INITIALIZATION</p>

        <h1 id="loading-title"></h1>
        <div class="portfolio-identity">
    <div class="portfolio-name">
        SHAHAR AVIDAN
    </div>

    <div class="portfolio-role">
        INTERACTIVE WEB DEVELOPER · THREE.JS
    </div>
</div>

        <div class="loading-info">
            <span>LOADING STATION ASSETS</span>
            <span id="loading-percent">000%</span>
        </div>

        <div class="loading-bar">
            <div id="loading-bar-fill"></div>
        </div>

        <button id="enter-button" disabled>
            ENTER STATION
        </button>
    </div>
</div>
    <div class="point" id="hotspot-cube">
        <div class="text">[ Cognitive Calibration Unit ]</div>
        <div class="label">1</div>
    </div>

    <div class="point" id="hotspot-terminal">
        <div class="text">[ Mainframe Access Console ]</div>
        <div class="label">2</div>
    </div>
</body>
</html>
